[project]
name = "llmimage"
version = "0.1.5"
description = "A web studio for any OpenAI-compatible image generation endpoint (generations, edits, variations, streaming)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ugo Varetto" }]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "python-multipart>=0.0.32",
]

[project.scripts]
llmimage = "llmimage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmimage"]

# The backend serves the studio, so the built SPA ships inside the package: `uv tool install
# llmimage` has to work on a machine with no Node. Build it first (scripts/build.sh).
[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "llmimage/web/dist"

[tool.hatch.build.targets.sdist]
artifacts = ["web/dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
