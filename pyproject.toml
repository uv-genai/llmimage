[project]
name = "llmimage"
version = "0.1.0"
description = "A web studio for any OpenAI-compatible image generation endpoint (generations, edits, variations, streaming)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "python-multipart>=0.0.32",
]

[project.scripts]
llmimage = "llmimage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmimage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
